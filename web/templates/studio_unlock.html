<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accès Studio — Manga Translator</title>
  <link rel="stylesheet" href="/static/css/style.css?v=5">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .unlock-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .unlock-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }
    .input-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 0.85rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-1px);
    }
    .error-msg {
      color: #f87171;
      font-size: 0.85rem;
      margin-top: 1rem;
      display: none;
    }
    .back-link {
      margin-top: 1.5rem;
      display: inline-block;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    .back-link:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="unlock-card">
    <div class="unlock-icon">🔒</div>
    <h1>Accès Studio de Traduction</h1>
    <p>Le studio local est protégé. Veuillez renseigner le code d'accès administrateur pour déverrouiller la console.</p>
    
    <form id="unlock-form" onsubmit="handleUnlock(event)">
      <div class="input-group">
        <label for="passcode">Code d'accès Studio</label>
        <input type="password" id="passcode" name="key" placeholder="••••••••" autofocus required>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">Déverrouiller le Studio</button>
      <div class="error-msg" id="error-msg">Code d'accès incorrect. Veuillez réessayer.</div>
    </form>
    
    <a href="/" class="back-link">← Retour à la vitrine d'accueil</a>
  </div>

  <script>
    async function handleUnlock(e) {
      e.preventDefault();
      const key = document.getElementById('passcode').value.trim();
      const btn = document.getElementById('submit-btn');
      const err = document.getElementById('error-msg');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Vérification...';

      try {
        const res = await fetch('/api/studio/unlock', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Origin': window.location.origin
          },
          body: JSON.stringify({ key: key })
        });
        if (res.ok) {
          window.location.reload();
        } else {
          err.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Déverrouiller le Studio';
        }
      } catch (e) {
        err.textContent = 'Erreur réseau de communication.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Déverrouiller le Studio';
      }
    }
  </script>
</body>
</html>
